<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tantra Outreach Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Tantra page chrome (brand tokens) */
  --ink:#0b0d12;--paper:#f7f8fb;--line:#e3e6ee;--muted:#5b6472;--volt:#6d4aff;--volt-deep:#4b2fd6;--lilac:#f1efff;
  /* apps */
  --li:#0a66c2;--li-green:#01754f;--li-text:rgba(0,0,0,.9);--li-text2:rgba(0,0,0,.6);--li-border:rgba(0,0,0,.08);--li-field:#f3f2f0;
  --gm-red:#ea4335;--gm-blue:#0b57d0;--gm-text:#1f1f1f;--gm-text2:#444746;--gm-surface:#f6f8fc;--gm-chip:#e9eef6;
  --gc-blue:#1a73e8;--gc-event:#039be5;--gc-text:#3c4043;--gc-text2:#70757a;--gc-line:#e0e0e0;
  --s:.8;--pw:417px;--ph:876px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit}
a{color:inherit}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:transparent}
.brand-mark img{display:block;width:30px;height:30px;object-fit:contain}
.li-hl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li-hl1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.brand-mark i{display:block;width:12px;height:12px;border-radius:3px;background:var(--volt);transform:rotate(45deg)}
.brand-title{font-weight:700;font-size:15px;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--muted)}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:12.5px;color:#333;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#333;cursor:pointer;user-select:none}
.tgl input{accent-color:var(--volt)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 56px)}
.sidenav{position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow:auto;padding:14px 12px 40px;border-right:1px solid var(--line);background:#fbfbfd}
.sidenav h4{display:flex;align-items:center;gap:8px;margin:16px 8px 6px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.sidenav h4 .dot{width:9px;height:9px;border-radius:3px}
.sidenav a{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;color:#222;text-decoration:none;cursor:pointer}
.sidenav a:hover{background:#eef0f5}
.sidenav a.active{background:var(--lilac);color:var(--volt-deep);font-weight:600}
.sidenav a .n{font-size:11px;color:var(--muted)}
main{padding:12px 0 80px;min-width:0}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidenav{display:none}}

.intro{padding:14px 28px 4px;max-width:1100px}
.intro .eyebrow{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--volt-deep)}
.intro h1{margin:6px 0 6px;font-size:26px;letter-spacing:-.02em;line-height:1.15}
.intro p{margin:0 0 6px;color:var(--muted);font-size:14px;line-height:1.55;max-width:860px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* channel band */
.channel{margin-top:22px;border-top:1px solid var(--line)}
.channel-head{display:flex;align-items:center;gap:14px;padding:20px 28px 6px;flex-wrap:wrap}
.app-ic{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.app-ic.li{background:var(--li)}
.app-ic.gm{background:#fff;border:1px solid var(--line)}
.app-ic.gc{background:#fff;border:1px solid var(--line)}
.channel-head h2{margin:0;font-size:22px;letter-spacing:-.02em}
.channel-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.channel.li-band .channel-head{box-shadow:inset 4px 0 0 var(--li)}
.channel.gm-band .channel-head{box-shadow:inset 4px 0 0 var(--gm-red)}
.channel.gc-band .channel-head{box-shadow:inset 4px 0 0 var(--gc-blue)}
.senders{display:flex;gap:6px;flex-wrap:wrap;padding:8px 28px 0}
.sender{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600;cursor:pointer}
.sender.on{border-color:var(--li);box-shadow:0 0 0 1px var(--li) inset;color:var(--li)}
.sender .av{width:26px;height:26px;font-size:10.5px}

.campaign{padding:16px 0 4px}
.campaign-head{padding:0 28px 2px}
.campaign-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.campaign-head h3{margin:0;font-size:17px;letter-spacing:-.01em}
.campaign-head p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.5;max-width:980px}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:#eceef3;color:#444}
.chip.test{background:#e8f0fe;color:#1a56c4}.chip.next{background:#fff1dc;color:#a15c00}.chip.re{background:#fdeaea;color:#9b1c1c}
.chip.tag{background:#fff3b0;color:#5c4a00}.chip.li{background:#e6eef7;color:var(--li)}
.trackname{padding:10px 28px 0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.rail{display:flex;gap:24px;overflow-x:auto;padding:12px 28px 20px;scroll-snap-type:x proximity;scroll-padding:28px}
.rail::-webkit-scrollbar{height:10px}.rail::-webkit-scrollbar-thumb{background:#d4d7df;border-radius:6px}

/* ---------- card ---------- */
.card{flex:0 0 auto;width:calc(var(--pw) * var(--s));scroll-snap-align:start}
.card-head{min-height:56px;padding:2px 2px 10px;display:flex;gap:10px;align-items:flex-start}
.step-num{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;margin-top:1px}
.card-label{font-weight:700;font-size:14px;line-height:1.3}
.card-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.card-foot{padding:10px 2px 0;font-size:12px;color:var(--muted)}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.copies{display:flex;gap:6px;flex-wrap:wrap}
.copy{border:1px solid #cfd3dc;background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:#222;white-space:nowrap}
.copy:hover{background:var(--lilac);border-color:var(--volt);color:var(--volt-deep)}
.copy.alt{font-size:11.5px;padding:3px 9px}
.subjects{margin-top:8px;display:grid;gap:5px}
.subjects div{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 6px 5px 10px;font-size:12.5px;color:#222}

/* ---------- phone ---------- */
.phone-wrap{width:calc(var(--pw) * var(--s));height:calc(var(--ph) * var(--s));position:relative}
.phone{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);transform:scale(var(--s));transform-origin:top left;background:#0b0b0c;border-radius:64px;padding:12px;box-shadow:0 18px 40px rgba(11,13,18,.2),0 2px 6px rgba(11,13,18,.16)}
.phone::before{content:"";position:absolute;inset:3px;border-radius:61px;border:1.5px solid rgba(255,255,255,.14);pointer-events:none}
.screen{position:relative;width:393px;height:852px;background:#fff;border-radius:52px;overflow:hidden;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Roboto,Arial,sans-serif}
.island{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:5}
.sb{height:56px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px 38px;font-size:16.5px;font-weight:600;letter-spacing:-.2px;color:#000}
.sb-icons{display:flex;align-items:center;gap:6px}.sb-icons svg{display:block}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:#000;z-index:5}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.body::-webkit-scrollbar{width:0;height:0}
.ic{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;color:inherit;flex:none}
.ic svg{display:block}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;flex:0 0 auto;position:relative;letter-spacing:.2px}
.selectable{user-select:text;-webkit-user-select:text;cursor:text}
.tok{background:#fff3b0;border-radius:3px;padding:0 2px;color:#5c4a00;font-weight:600}
.mf{background:rgba(109,74,255,.1);border-radius:3px;box-shadow:inset 0 -1px 0 rgba(109,74,255,.45)}
body.no-mark .mf{background:none;box-shadow:none}

/* LinkedIn */
.li-nav{display:flex;align-items:center;gap:4px;height:52px;padding:0 10px 0 6px;border-bottom:1px solid var(--li-border);flex:0 0 auto;color:var(--li-text)}
.li-nav .t{flex:1;min-width:0}
.li-nav .nm{font-size:16px;font-weight:600;line-height:20px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-nav .st{font-size:12px;color:var(--li-text2);display:flex;align-items:center;gap:5px}
.li-nav .st i{width:8px;height:8px;border-radius:50%;background:var(--li-green)}
.li-nav .center{flex:1;text-align:center;font-size:16px;font-weight:600;color:#000}
.li-profile{padding:22px 16px 6px}
.li-profile .nm{margin-top:10px;font-size:16px;font-weight:600;color:#000}.li-profile .nm span{font-weight:400;font-size:12px;color:var(--li-text2)}
.li-profile .hd{font-size:13px;color:var(--li-text);margin-top:2px}
.li-sep{text-align:center;font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--li-text2);padding:16px 0 6px;text-transform:uppercase}
.li-msg{position:relative;display:flex;gap:8px;padding:7px 16px 5px}
.li-msg .mb{flex:1;min-width:0}
.li-msg .mh{display:flex;align-items:baseline;gap:5px}
.li-msg .mn{font-size:14px;font-weight:600;color:#000}.li-msg .mt{font-size:12px;color:var(--li-text2)}
.li-text{font-size:14px;line-height:20px;color:var(--li-text);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin-top:1px}
.li .lnk,.lnk-li{color:var(--li);font-weight:600;text-decoration:none}
.li-prev{display:block;text-decoration:none;margin-top:8px;border:1px solid rgba(0,0,0,.12);border-radius:8px;overflow:hidden;background:#fff;max-width:300px}
.li-prev .img{height:92px;background:linear-gradient(135deg,#0b0d12,#2a1f6b 60%,#6d4aff);display:flex;align-items:flex-end;padding:10px 12px;color:#fff;font-weight:700;font-size:13px}
.li-prev .tx{padding:8px 12px 10px}.li-prev .tt{font-size:13px;font-weight:600;color:#000;line-height:17px}.li-prev .dm{font-size:12px;color:var(--li-text2);margin-top:3px}
body.no-preview .li-prev{display:none}
.li-composer{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px 22px;border-top:1px solid var(--li-border);color:var(--li-text2)}
.li-composer .in{flex:1;height:38px;border-radius:8px;background:var(--li-field);display:flex;align-items:center;padding:0 12px;font-size:15px;color:rgba(0,0,0,.55)}
.li-inv{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--li-border)}
.li-inv .m{flex:1;min-width:0}.li-inv .n{font-size:16px;font-weight:600;color:#000}.li-inv .h{font-size:13px;color:var(--li-text);margin-top:2px}
.li-inv .mut{font-size:12px;color:var(--li-text2);margin-top:4px}
.li-note{margin-top:10px;padding:10px 12px;background:#f3f2ef;border-radius:8px}
.li-note.none{color:var(--li-text2);font-style:italic;font-size:13px}
.li-acts{display:flex;gap:8px;margin-top:12px}
.li-pill{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 16px;border-radius:16px;border:1px solid var(--li-text2);color:var(--li-text2);font-size:15px;font-weight:600}
.li-pill.fill{background:var(--li);border-color:var(--li);color:#fff}
.li-tabs{display:flex;gap:8px;padding:12px 16px 6px}
.li-tabs span{font-size:14px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid rgba(0,0,0,.6);color:var(--li-text)}
.li-tabs span.on{background:var(--li-green);border-color:var(--li-green);color:#fff}
.li-row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--li-border);align-items:flex-start}
.li-row.new{background:#edf3f8}
.li-row .t{flex:1;font-size:14px;line-height:19px;color:var(--li-text)}.li-row .t small{display:block;color:var(--li-text2);font-size:12px;margin-top:3px}
.li-inmail{padding:14px 16px}
.li-inmail .badge{display:inline-block;background:#f5ecd0;color:#7a5b00;font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px}
.li-inmail .subj{font-size:16px;font-weight:600;color:#000;margin:10px 0 8px;line-height:21px}

/* Gmail */
.gm-search{margin:4px 14px 6px;height:48px;border-radius:24px;background:var(--gm-chip);display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;color:var(--gm-text2);font-size:16px}
.gm-search .q{flex:1}
.gm-label{padding:10px 18px 4px;font-size:12.5px;color:var(--gm-text2)}
.gm-row{display:flex;gap:12px;padding:10px 16px 12px;align-items:flex-start}
.gm-row .c{flex:1;min-width:0}
.gm-row .l1{display:flex;justify-content:space-between;gap:8px;font-size:16px;color:var(--gm-text)}
.gm-row .l1 .tm{font-size:12px;color:var(--gm-text2);flex:none;padding-top:2px}
.gm-row .sj{font-size:14px;color:var(--gm-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.gm-row .sn{font-size:14px;color:var(--gm-text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:19px;margin-top:1px}
.gm-row.unread .l1 .who,.gm-row.unread .sj,.gm-row.unread .tm{font-weight:700;color:#000}
.gm-row.ours{background:#f1effe}
.gm-row .star{color:#9aa0a6;padding-top:24px}
.gm-fab{position:absolute;right:18px;bottom:96px;height:56px;padding:0 20px 0 16px;border-radius:16px;background:#c2e7ff;color:#001d35;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.gm-tabbar{flex:0 0 auto;height:76px;border-top:1px solid #e6e6e6;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;color:var(--gm-text2);font-size:12px}
.gm-tabbar div{display:flex;flex-direction:column;align-items:center;gap:2px}
.gm-tabbar .on{color:#001d35;font-weight:700}
.gm-tabbar .on span:first-child{background:#c2e7ff;border-radius:16px;padding:2px 18px}
.gm-top{flex:0 0 auto;display:flex;align-items:center;height:48px;padding:0 6px;color:var(--gm-text2)}
.gm-top .sp{flex:1}
.gm-subject{padding:6px 18px 4px;font-size:22px;line-height:28px;color:var(--gm-text)}
.gm-subject .lab{display:inline-block;vertical-align:middle;font-size:12px;line-height:18px;background:#e7e7e7;color:#444;border-radius:4px;padding:0 6px;margin-left:6px}
.gm-collapsed{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #eee}
.gm-collapsed .c{flex:1;min-width:0}.gm-collapsed .w{display:flex;justify-content:space-between;font-size:15px;color:var(--gm-text)}
.gm-collapsed .w span{font-size:12px;color:var(--gm-text2)}
.gm-collapsed .s{font-size:14px;color:var(--gm-text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-msg{padding:12px 16px}
.gm-from{display:flex;gap:12px;align-items:flex-start}
.gm-from .c{flex:1;min-width:0}.gm-from .w{font-size:15px;font-weight:600;color:var(--gm-text)}.gm-from .w span{font-weight:400;font-size:12px;color:var(--gm-text2);margin-left:6px}
.gm-from .to{font-size:13px;color:var(--gm-text2)}
.gm-text{margin-top:14px;font-size:15px;line-height:22px;color:var(--gm-text);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.gm-text .lnk{color:var(--gm-blue);text-decoration:underline}
.gm-replybar{flex:0 0 auto;display:flex;gap:10px;padding:10px 16px 26px;border-top:1px solid #eee}
.gm-replybar span{flex:1;height:40px;border:1px solid #c4c7c5;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--gm-text);font-size:14px;font-weight:500}
/* Gmail invitation */
.gi-card{margin:14px 16px 0;border:1px solid #dadce0;border-radius:12px;overflow:hidden}
.gi-head{padding:14px 16px 12px}
.gi-head .t{font-size:18px;line-height:24px;color:var(--gm-text);font-weight:500}
.gi-row{display:flex;gap:12px;margin-top:10px;font-size:14px;line-height:19px;color:var(--gm-text)}
.gi-row .k{width:72px;flex:none;color:var(--gm-text2)}
.gi-row .lnk{color:var(--gm-blue)}
.gi-rsvp{border-top:1px solid #dadce0;padding:12px 16px;background:#f8f9fa}
.gi-rsvp .r{font-size:12.5px;color:var(--gm-text2)}
.gi-rsvp .b{display:flex;gap:8px;margin-top:8px}
.gi-rsvp .b span{flex:1;height:34px;border:1px solid #dadce0;border-radius:17px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--gm-blue)}
.gi-desc{border-top:1px solid #dadce0;padding:14px 16px;font-size:14px;line-height:21px;color:var(--gm-text);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.gi-desc .lnk{color:var(--gm-blue);text-decoration:underline}
.gi-foot{padding:12px 16px 30px;font-size:11.5px;line-height:16px;color:var(--gm-text2)}

/* Google Calendar */
.gc-top{flex:0 0 auto;display:flex;align-items:center;gap:2px;height:52px;padding:0 8px;color:var(--gc-text)}
.gc-top .m{flex:1;font-size:22px;color:var(--gc-text);padding-left:4px}
.gc-today{width:22px;height:22px;border:2px solid var(--gc-text);border-radius:4px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.gc-week{flex:0 0 auto;display:grid;grid-template-columns:44px repeat(3,1fr);padding:0 0 6px;border-bottom:1px solid var(--gc-line)}
.gc-week .d{text-align:center;color:var(--gc-text2);font-size:12px}
.gc-week .d b{display:block;margin:2px auto 0;width:34px;height:34px;line-height:34px;border-radius:50%;font-size:20px;font-weight:400;color:var(--gc-text)}
.gc-week .d.on{color:var(--gc-blue);font-weight:600}.gc-week .d.on b{background:var(--gc-blue);color:#fff}
.gc-grid{position:relative;display:grid;grid-template-columns:44px repeat(3,1fr)}
.gc-hr{height:64px;border-top:1px solid var(--gc-line);font-size:10.5px;color:var(--gc-text2);text-align:right;padding-right:6px;transform:translateY(-7px);border-top-color:transparent}
.gc-col{position:relative;border-left:1px solid var(--gc-line);background:repeating-linear-gradient(to bottom,var(--gc-line) 0,var(--gc-line) 1px,transparent 1px,transparent 64px)}
.gc-ev{position:absolute;left:2px;right:3px;border-radius:5px;padding:3px 5px;font-size:11.5px;line-height:14px;overflow:hidden;word-break:break-word}
.gc-ev.mine{background:#33b679;color:#fff}
.gc-ev.mine2{background:#8e24aa;color:#fff}
.gc-ev.pending{background:#fff;border:1.5px solid var(--gc-event);color:#01579b;font-weight:600}
.gc-ev small{display:block;font-weight:400;opacity:.9}
.gc-now{position:absolute;left:44px;right:0;height:2px;background:#ea4335;z-index:2}
.gc-now::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:#ea4335}
.gc-fab{position:absolute;right:18px;bottom:40px;width:56px;height:56px;border-radius:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.gc-detail-top{flex:0 0 auto;display:flex;align-items:center;height:52px;padding:0 6px;color:var(--gc-text)}
.gc-detail-top .sp{flex:1}
.gc-title{display:flex;gap:16px;padding:8px 20px 4px}
.gc-title .sq{width:16px;height:16px;border-radius:4px;background:var(--gc-event);flex:none;margin-top:7px}
.gc-title .t{font-size:22px;line-height:28px;color:var(--gc-text)}
.gc-title .w{font-size:14px;color:var(--gc-text2);margin-top:4px;line-height:20px}
.gc-line{display:flex;gap:16px;padding:12px 20px;align-items:flex-start;font-size:14px;line-height:20px;color:var(--gc-text)}
.gc-line .i{width:20px;flex:none;color:var(--gc-text2);display:flex;justify-content:center;padding-top:1px}
.gc-line .v{flex:1;min-width:0;overflow-wrap:anywhere}
.gc-line .v small{display:block;color:var(--gc-text2);font-size:12.5px}
.gc-line .lnk{color:var(--gc-blue);text-decoration:none}
.gc-desc{white-space:pre-wrap;word-wrap:break-word}
.gc-desc .lnk{color:var(--gc-blue);text-decoration:underline}
.gc-going{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px 28px;border-top:1px solid var(--gc-line);font-size:14px;color:var(--gc-text)}
.gc-going .g{flex:1;font-weight:500}
.gc-going span.b{height:34px;padding:0 16px;border:1px solid #dadce0;border-radius:17px;display:inline-flex;align-items:center;font-weight:500;color:var(--gc-text)}

/* Reply table and link check */
.panel{margin:10px 28px 6px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:1100px}
.panel table{border-collapse:collapse;width:100%;font-size:13.5px}
.panel th,.panel td{padding:10px 14px;text-align:left;border-bottom:1px solid #eef0f4;vertical-align:top;line-height:1.5}
.panel th{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);background:#fafbfd}
.panel td.k{font-weight:600;white-space:nowrap}
.panel .lnk{color:var(--li);word-break:break-all;text-decoration:none}
.st{font-weight:600;font-size:12px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.st.ok{background:#e1f4e8;color:#0b6e4f}.st.warn{background:#fff1dc;color:#a15c00}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer.page{padding:30px 28px 0;font-size:12px;color:var(--muted);max-width:1100px;line-height:1.6}

/* review layer */
.rv-cbtn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:600 12.5px/1.4 Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.rv-cbtn.has{background:#fff4d6;border-color:#f0c24b}
.rv-panel{margin:10px 0 4px;max-width:760px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rv-c{border-bottom:1px solid var(--line);padding:8px 0}.rv-c.done{opacity:.55}
.rv-ch{display:flex;gap:8px;align-items:center;font-size:12.5px}.rv-ch span{color:var(--muted)}
.rv-ch button,.rv-h button{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;padding:2px 8px;cursor:pointer}
.rv-cb{white-space:pre-wrap;font-size:14px;margin-top:4px;line-height:1.5}
.rv-empty{color:var(--muted);font-size:13px;padding:4px 0 8px}
.rv-form{display:grid;gap:8px;margin-top:10px}
.rv-form input,.rv-form textarea,#rv-name,#rv-text{font:14px/1.5 Inter,system-ui,sans-serif;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box}
.rv-form textarea{min-height:70px;resize:vertical}
.rv-form button,.rv-save{justify-self:start;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:8px 14px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.rv-edit{border-style:dashed}.rv-edit.edited{background:#fff4d6;border-color:#f0c24b;border-style:solid}
#rv-modal{position:fixed;inset:0;background:rgba(11,13,18,.45);display:none;align-items:flex-start;justify-content:center;z-index:200;overflow:auto;padding:40px 16px}
#rv-modal.show{display:flex}
.rv-box{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.rv-mh{display:flex;gap:10px;align-items:center}.rv-mh code{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-x{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer}
.rv-hint{font-size:12.5px;color:var(--muted);margin:6px 0 10px}
#rv-text{min-height:300px;resize:vertical;font-size:14.5px}
.rv-row{display:flex;gap:10px;align-items:center;margin:10px 0}.rv-row #rv-name{max-width:220px}.rv-count{font-size:12px;color:var(--muted);margin-left:auto}
.rv-box details{margin-top:6px;font-size:13px}.rv-h{border-top:1px solid var(--line);padding:8px 0}.rv-h>div{display:flex;gap:6px;align-items:center}
.rv-h pre{white-space:pre-wrap;font:12.5px/1.5 Inter,system-ui,sans-serif;background:var(--paper);border-radius:8px;padding:8px;margin:6px 0 0;max-height:200px;overflow:auto}
</style>
</head>

.\n\nI run it every Thursday at 10:00 UK time (11:00 in Central Europe), 60 minutes. Your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=adi", "subject": ""}, {"track": "2nd/3rd degree", "step": 4, "days": 4, "when": "", "action": "Message", "chars": "396", "text": "{{firstName}}, one example I break down in the session.\n\nFor FintechCircle, a London fintech network, outreach grew from 10,000 to 20,046 to 30,000 calendar invites across three episodes. Those three episodes booked 17 sales calls.\n\nI show how it was built, stage by stage: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=adi", "subject": ""}]}, {"name": "1st degree", "rows": [{"track": "1st degree", "step": 1, "days": 0, "when": "", "action": "Message", "chars": "394", "text": "Hi {{firstName}}, thanks for engaging with my post on {{custom.post_topic}}.\n\nI unpack the full system behind it live every Thursday at 10:00 UK time (11:00 in Central Europe): funnel, RevOps, AI and the channels that feed it. 60 minutes.\n\nWant a seat? https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=adi", "subject": ""}, {"track": "1st degree", "step": 2, "days": 4, "when": "", "action": "Message", "chars": "295", "text": "{{firstName}}, quick follow-up. If {{custom.post_topic}} is on your plate this quarter, the session shows where it plugs into a pipeline you can predict: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=adi", "subject": ""}]}]}, {"title": "InMail", "full": "InMail (Shared Template, Sales Navigator Only)", "who": "Prospects in this sender's audience who are not connected and are worth an InMail: Open Profiles first (no credit used), then the best fits on credits. Off until this account is on Sales Navigator. If Tantra shows no InMail step, step 1 is sent by hand in Sales Navigator and, 5 days later, **only the people who did not reply** are imported into the follow-up campaign.", "tracks": [{"name": "InMail", "rows": [{"track": "InMail", "step": 1, "days": 0, "when": "", "action": "InMail", "chars": "746", "text": "Hi {{firstName}},\n\nQuick question: could you predict next quarter's booked sales calls at {{company}} today?\n\nMost founders I speak with can't. Leads come from referrals, a good month on ads, a lucky post. Nothing they can measure and repeat, and every cold call then has to earn trust from zero.\n\nI host a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on building the other kind of pipeline: the funnel, the RevOps system behind it and the AI that runs the busywork. It draws on 10+ years of work with 400+ brands.\n\n60 minutes, including 15 minutes of Q&A. Save your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=inmail&utm_campaign=enterprise-webinar&utm_content=adi\n\nAdi", "subject": "{{firstName}}, a question about pipeline at {{company}}"}]}, {"name": "Follow-up", "rows": [{"track": "Follow-up", "step": 1, "days": 0, "when": "5 days after the InMail, non-repliers only", "action": "Connection request with note (no note on free)", "chars": "138", "text": "Hi {{firstName}}, I sent you an InMail last week about building a pipeline you can measure. Connecting either way, as our work overlaps.", "subject": ""}, {"track": "Follow-up", "step": 2, "days": 1, "when": "1 day after they accept", "action": "Message", "chars": "295", "text": "Thanks for connecting, {{firstName}}. Here's the session link I mentioned: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=inmail&utm_campaign=enterprise-webinar&utm_content=adi\n\nIt runs every Thursday at 10:00 UK time (11:00 in Central Europe), so pick whichever week suits you.", "subject": ""}]}]}, {"title": "Connector", "full": "Connector (Shared Template)", "who": "Cold prospects in this sender's audience (2nd and 3rd degree). Only people who accept get the messages.", "tracks": [{"name": "main", "rows": [{"track": "main", "step": 1, "days": 0, "when": "", "action": "Visit profile", "chars": "n/a", "text": "", "subject": ""}, {"track": "main", "step": 2, "days": 1, "when": "", "action": "Connection request with note (no note on free)", "chars": "190", "text": "Hi {{firstName}}, could you predict next quarter's booked sales calls at {{company}} from the numbers you have today? That's the problem I work on. Glad to connect.", "subject": ""}, {"track": "main", "step": 3, "days": 1, "when": "1 day after they accept; no link yet", "action": "Message", "chars": "350", "text": "Thanks for connecting, {{firstName}}.\n\nOne pattern I see in almost every founder-led company: the problem isn't traffic. It's that nobody can see where a prospect drops out between first touch and a booked call.\n\nFix that view and the next hire, channel or budget decision gets obvious.\n\nHow does {{company}} track it today?", "subject": ""}, {"track": "main", "step": 4, "days": 3, "when": "", "action": "Message", "chars": "619", "text": "{{firstName}}, this is what we take apart live, every Thursday at 10:00 UK time (11:00 in Central Europe).\n\nA cold sales call has to build trust, frame the problem and close, all in one slot. A session does the first two before anyone books, so the call starts further along.\n\nI host the session: 60 minutes on the funnel, the RevOps system behind it, the AI that does the busywork and the channels that fill it.\n\nBring your numbers. You'll leave knowing which stage to fix first.\n\nSave your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=adi", "subject": ""}, {"track": "main", "step": 5, "days": 4, "when": "", "action": "Message", "chars": "422", "text": "This isn't theory, {{firstName}}.\n\nFor Growth Idea, a UK business-coaching group, one webinar reached 99,859 people. 1,990 registered, 321 came live and 25 booked sales calls.\n\nTheir first webinar got 30 registrations. Every stage was measured, so every week got better.\n\nThe session shows the build: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=adi", "subject": ""}, {"track": "main", "step": 6, "days": 6, "when": "", "action": "Message", "chars": "377", "text": "Last note from me, {{firstName}}.\n\nIf a predictable pipeline is on this year's list for {{company}}, the session runs every Thursday at 10:00 UK time (11:00 in Central Europe): https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=adi\n\nIf not, no hard feelings. Good luck with the quarter.", "subject": ""}]}]}, {"title": "Messenger", "full": "Messenger (Shared Template, 1st-Degree Connections)", "who": "This sender's own 1st-degree connections who match the audience and are owned by no other sender.", "tracks": [{"name": "main", "rows": [{"track": "main", "step": 1, "days": 0, "when": "", "action": "Message", "chars": "583", "text": "{{firstName}}, quick question: how much of {{company}}'s pipeline last quarter came from referrals nobody could have planned for?\n\nFor most founders I speak with, it's most of it.\n\nI host a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on building the other kind: a funnel, a RevOps system and AI on the busywork, measured stage by stage. It draws on 10+ years of work with 400+ brands.\n\n60 minutes. Want a seat? https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=adi", "subject": ""}, {"track": "main", "step": 2, "days": 4, "when": "", "action": "Message", "chars": "425", "text": "{{firstName}}, one number from the session: a UK coaching group went from 30 registrations on their first webinar to 1,990 on their best.\n\nSame team. The difference was measuring every stage and fixing the weakest one each week. The number we watch first is cost per booked call.\n\nSeat's here if useful: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=adi", "subject": ""}, {"track": "main", "step": 3, "days": 5, "when": "", "action": "Message", "chars": "303", "text": "Last nudge, {{firstName}}. It runs every week, so any Thursday works: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=adi\n\nAnd if a quick chat about {{company}} would help more than a session, just reply here.", "subject": ""}]}]}]}, {"key": "aquila", "name": "Aquila Eldho", "headline": "Head of Automations at GrowthClub.org", "role": "Automation", "pronouns": "", "initials": "AE", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCADAAMADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD8/wCiiigAr0X4Q/BPx58a/GI0LwbphaOP5rvUrgFLazT1kfHU9lGWPYYBI7f9nD9mHxP8dvEAvpzNpPhG1lC3mq7PmlI6xQA8M+O/Re+elfqPomh+DvhB4CtPCngzQ4LK0t0xFaw9WPeSRzyzHqWPJNJyUVdjSb0R518Fv2Y/hb+z/pEWszJFrHicIBLrt/GN6tjkW8fIiHJ6ZYg4LEV63b6veeIC66afstuvV3/1jfT0rzbVdR1HVb1ri8lZ2z8oPRB6AdquaXeXduuYpWU/XFck693psdEaNl5lnxRor6fMTO/nM/zbieT71xs s in this sender's audience who are not connected and are worth an InMail: Open Profiles first (no credit used), then the best fits on credits. Off until this account is on Sales Navigator. If Tantra shows no InMail step, step 1 is sent by hand in Sales Navigator and, 5 days later, **only the people who did not reply** are imported into the follow-up campaign.", "tracks": [{"name": "InMail", "rows": [{"track": "InMail", "step": 1, "days": 0, "when": "", "action": "InMail", "chars": "769", "text": "Hi {{firstName}},\n\nQuick question: could you predict next quarter's booked sales calls at {{company}} today?\n\nMost founders I speak with can't. Leads come from referrals, a good month on ads, a lucky post. Nothing they can measure and repeat, and every cold call then has to earn trust from zero.\n\nAdi, our founder, hosts a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on building the other kind of pipeline: the funnel, the RevOps system behind it and the AI that runs the busywork. It draws on 10+ years of work with 400+ brands.\n\n60 minutes, including 15 minutes of Q&A. Save your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=inmail&utm_campaign=enterprise-webinar&utm_content=aquila\n\nAquila", "subject": "{{firstName}}, a question about pipeline at {{company}}"}]}, {"name": "Follow-up", "rows": [{"track": "Follow-up", "step": 1, "days": 0, "when": "5 days after the InMail, non-repliers only", "action": "Connection request with note (no note on free)", "chars": "138", "text": "Hi {{firstName}}, I sent you an InMail last week about building a pipeline you can measure. Connecting either way, as our work overlaps.", "subject": ""}, {"track": "Follow-up", "step": 2, "days": 1, "when": "1 day after they accept", "action": "Message", "chars": "298", "text": "Thanks for connecting, {{firstName}}. Here's the session link I mentioned: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=inmail&utm_campaign=enterprise-webinar&utm_content=aquila\n\nIt runs every Thursday at 10:00 UK time (11:00 in Central Europe), so pick whichever week suits you.", "subject": ""}]}]}, {"title": "Connector", "full": "Connector (Shared Template)", "who": "Cold prospects in this sender's audience (2nd and 3rd degree). Only people who accept get the messages.", "tracks": [{"name": "main", "rows": [{"track": "main", "step": 1, "days": 0, "when": "", "action": "Visit profile", "chars": "n/a", "text": "", "subject": ""}, {"track": "main", "step": 2, "days": 1, "when": "", "action": "Connection request with note (no note on free)", "chars": "190", "text": "Hi {{firstName}}, could you predict next quarter's booked sales calls at {{company}} from the numbers you have today? That's the problem I work on. Glad to connect.", "subject": ""}, {"track": "main", "step": 3, "days": 1, "when": "1 day after they accept; no link yet", "action": "Message", "chars": "350", "text": "Thanks for connecting, {{firstName}}.\n\nOne pattern I see in almost every founder-led company: the problem isn't traffic. It's that nobody can see where a prospect drops out between first touch and a booked call.\n\nFix that view and the next hire, channel or budget decision gets obvious.\n\nHow does {{company}} track it today?", "subject": ""}, {"track": "main", "step": 4, "days": 3, "when": "", "action": "Message", "chars": "639", "text": "{{firstName}}, this is what we take apart live, every Thursday at 10:00 UK time (11:00 in Central Europe).\n\nA cold sales call has to build trust, frame the problem and close, all in one slot. A session does the first two before anyone books, so the call starts further along.\n\nAdi, our founder, hosts the session: 60 minutes on the funnel, the RevOps system behind it, the AI that does the busywork and the channels that fill it.\n\nBring your numbers. You'll leave knowing which stage to fix first.\n\nSave your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=aquila", "subject": ""}, {"track": "main", "step": 5, "days": 4, "when": "", "action": "Message", "chars": "425", "text": "This isn't theory, {{firstName}}.\n\nFor Growth Idea, a UK business-coaching group, one webinar reached 99,859 people. 1,990 registered, 321 came live and 25 booked sales calls.\n\nTheir first webinar got 30 registrations. Every stage was measured, so every week got better.\n\nThe session shows the build: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=aquila", "subject": ""}, {"track": "main", "step": 6, "days": 6, "when": "", "action": "Message", "chars": "380", "text": "Last note from me, {{firstName}}.\n\nIf a predictable pipeline is on this year's list for {{company}}, the session runs every Thursday at 10:00 UK time (11:00 in Central Europe): https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=aquila\n\nIf not, no hard feelings. Good luck with the quarter.", "subject": ""}]}]}, {"title": "Messenger", "full": "Messenger (Shared Template, 1st-Degree Connections)", "who": "This sender's own 1st-degree connections who match the audience and are owned by no other sender.", "tracks": [{"name": "main", "rows": [{"track": "main", "step": 1, "days": 0, "when": "", "action": "Message", "chars": "603", "text": "{{firstName}}, quick question: how much of {{company}}'s pipeline last quarter came from referrals nobody could have planned for?\n\nFor most founders I speak with, it's most of it.\n\nAdi, our founder, hosts a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on building the other kind: a funnel, a RevOps system and AI on the busywork, measured stage by stage. It draws on 10+ years of work with 400+ brands.\n\n60 minutes. Want a seat? https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=aquila", "subject": ""}, {"track": "main", "step": 2, "days": 4, "when": "", "action": "Message", "chars": "428", "text": "{{firstName}}, one number from the session: a UK coaching group went from 30 registrations on their first webinar to 1,990 on their best.\n\nSame team. The difference was measuring every stage and fixing the weakest one each week. The number we watch first is cost per booked call.\n\nSeat's here if useful: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=aquila", "subject": ""}, {"track": "main", "step": 3, "days": 5, "when": "", "action": "Message", "chars": "306", "text": "Last nudge, {{firstName}}. It runs every week, so any Thursday works: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=aquila\n\nAnd if a quick chat about {{company}} would help more than a session, just reply here.", "subject": ""}]}]}]}, {"key": "nelbin", "name": "Nelbin Joseph", "headline": "I build things with AI & Automation and share what I learn along the way | Always learning and building.", "role": "Operations", "pronouns": "He/Him", "initials": "NJ", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCADAAMADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX sets": [{"title": "Content Engagement", "full": "Content Engagement (Personal: Likers and Commenters of My Posts)", "who": "People who liked or commented on one of this sender's own posts. One campaign per post, started within 24 hours of the post. Split the engager export by degree: 2nd and 3rd degree run the connect track, 1st degree the message track.", "tracks": [{"name": "2nd/3rd degree", "rows": [{"track": "2nd/3rd degree", "step": 1, "days": 0, "when": "same day the engager list is imported", "action": "Visit profile", "chars": "n/a", "text": "", "subject": ""}, {"track": "2nd/3rd degree", "step": 2, "days": 0, "when": "", "action": "Connection request with note (no note on free)", "chars": "195", "text": "Hi {{firstName}}, good to see you on my post about {{custom.post_topic}}. I work on the operations side, and a session every Thursday covers it step by step. Glad to connect.", "subject": ""}, {"track": "2nd/3rd degree", "step": 3, "days": 1, "when": "1 day after they accept", "action": "Message", "chars": "537", "text": "Glad we're connected, {{firstName}}.\n\nMy post on {{custom.post_topic}} covered one step. Operations leaders I speak with usually inherit a pipeline with no owner per stage and no weekly number. The session covers that fix: who owns each stage, what gets measured weekly and what the AI handles.\n\nAdi, our founder, hosts it every Thursday at 10:00 UK time (11:00 in Central Europe). Your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=nelbin", "subject": ""}, {"track": "2nd/3rd degree", "step": 4, "days": 4, "when": "", "action": "Message", "chars": "363", "text": "{{firstName}}, a process example from the session.\n\nIn one logged experiment for a UK coaching group, a 100,000-invite calendar push aimed for 250 attendees and got 441. Logging it is what made it repeatable.\n\nThe full checklist is here: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=nelbin", "subject": ""}]}, {"name": "1st degree", "rows": [{"track": "1st degree", "step": 1, "days": 0, "when": "", "action": "Message", "chars": "384", "text": "{{firstName}}, good to see you on my {{custom.post_topic}} post.\n\nAdi, our founder, runs a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on turning revenue into a process with an owner and a number for every stage: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=nelbin", "subject": ""}, {"track": "1st degree", "step": 2, "days": 4, "when": "", "action": "Message", "chars": "262", "text": "{{firstName}}, following up once. Thursday's session turns {{custom.post_topic}} into a weekly checklist you can run: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=nelbin", "subject": ""}]}]}, {"title": "InMail", "full": "InMail (Shared Template, Sales Navigator Only)", "who": "Prospects in this sender's audience who are not connected and are worth an InMail: Open Profiles first (no credit used), then the best fits on credits. Off until this account is on Sales Navigator. If Tantra shows no InMail step, step 1 is sent by hand in Sales Navigator and, 5 days later, **only the people who did not reply** are imported into the follow-up campaign.", "tracks": [{"name": "InMail", "rows": [{"track": "InMail", "step": 1, "days": 0, "when": "", "action": "InMail", "chars": "769", "text": "Hi {{firstName}},\n\nQuick question: could you predict next quarter's booked sales calls at {{company}} today?\n\nMost founders I speak with can't. Leads come from referrals, a good month on ads, a lucky post. Nothing they can measure and repeat, and every cold call then has to earn trust from zero.\n\nAdi, our founder, hosts a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on building the other kind of pipeline: the funnel, the RevOps system behind it and the AI that runs the busywork. It draws on 10+ years of work with 400+ brands.\n\n60 minutes, including 15 minutes of Q&A. Save your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=inmail&utm_campaign=enterprise-webinar&utm_content=nelbin\n\nNelbin", "subject": "{{firstName}}, a question about pipeline at {{company}}"}]}, {"name": "Follow-up", "rows": [{"track": "Follow-up", "step": 1, "days": 0, "when": "5 days after the InMail, non-repliers only", "action": "Connection request with note (no note on free)", "chars": "138", "text": "Hi {{firstName}}, I sent you an InMail last week about building a pipeline you can measure. Connecting either way, as our work overlaps.", "subject": ""}, {"track": "Follow-up", "step": 2, "days": 1, "when": "1 day after they accept", "action": "Message", "chars": "298", "text": "Thanks for connecting, {{firstName}}. Here's the session link I mentioned: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=inmail&utm_campaign=enterprise-webinar&utm_content=nelbin\n\nIt runs every Thursday at 10:00 UK time (11:00 in Central Europe), so pick whichever week suits you.", "subject": ""}]}]}, {"title": "Connector", "full": "Connector (Shared Template)", "who": "Cold prospects in this sender's audience (2nd and 3rd degree). Only people who accept get the messages.", "tracks": [{"name": "main", "rows": [{"track": "main", "step": 1, "days": 0, "when": "", "action": "Visit profile", "chars": "n/a", "text": "", "subject": ""}, {"track": "main", "step": 2, "days": 1, "when": "", "action": "Connection request with note (no note on free)", "chars": "190", "text": "Hi {{firstName}}, could you predict next quarter's booked sales calls at {{company}} from the numbers you have today? That's the problem I work on. Glad to connect.", "subject": ""}, {"track": "main", "step": 3, "days": 1, "when": "1 day after they accept; no link yet", "action": "Message", "chars": "350", "text": "Thanks for connecting, {{firstName}}.\n\nOne pattern I see in almost every founder-led company: the problem isn't traffic. It's that nobody can see where a prospect drops out between first touch and a booked call.\n\nFix that view and the next hire, channel or budget decision gets obvious.\n\nHow does {{company}} track it today?", "subject": ""}, {"track": "main", "step": 4, "days": 3, "when": "", "action": "Message", "chars": "639", "text": "{{firstName}}, this is what we take apart live, every Thursday at 10:00 UK time (11:00 in Central Europe).\n\nA cold sales call has to build trust, frame the problem and close, all in one slot. A session does the first two before anyone books, so the call starts further along.\n\nAdi, our founder, hosts the session: 60 minutes on the funnel, the RevOps system behind it, the AI that does the busywork and the channels that fill it.\n\nBring your numbers. You'll leave knowing which stage to fix first.\n\nSave your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=nelbin", "subject": ""}, {"track": "main", "step": 5, "days": 4, "when": "", "action": "Message", "chars": "425", "text": "This isn't theory, {{firstName}}.\n\nFor Growth Idea, a UK business-coaching group, one webinar reached 99,859 people. 1,990 registered, 321 came live and 25 booked sales calls.\n\nTheir first webinar got 30 registrations. Every stage was measured, so every week got better.\n\nThe session shows the build: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=nelbin", "subject": ""}, {"track": "main", "step": 6, "days": 6, "when": "", "action": "Message", "chars": "380", "text": "Last note from me, {{firstName}}.\n\nIf a predictable pipeline is on this year's list for {{company}}, the session runs every Thursday at 10:00 UK time (11:00 in Central Europe): https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=nelbin\n\nIf not, no hard feelings. Good luck with the quarter.", "subject": ""}]}]}, {"title": "Messenger", "full": "Messenger (Shared Template, 1st-Degree Connections)", "who": "This sender's own 1st-degree connections who match the audience and are owned by no other sender.", "tracks": [{"name": "main", "rows": [{"track": "main", "step": 1, "days": 0, "when": "", "action": "Message", "chars": "603", "text": "{{firstName}}, quick question: how much of {{company}}'s pipeline last quarter came from referrals nobody could have planned for?\n\nFor most founders I speak with, it's most of it.\n\nAdi, our founder, hosts a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on building the other kind: a funnel, a RevOps system and AI on the busywork, measured stage by stage. It draws on 10+ years of work with 400+ brands.\n\n60 minutes. Want a seat? https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=nelbin", "subject": ""}, {"track": "main", "step": 2, "days": 4, "when": "", "action": "Message", "chars": "428", "text": "{{firstName}}, one number from the session: a UK coaching group went from 30 registrations on their first webinar to 1,990 on their best.\n\nSame team. The difference was measuring every stage and fixing the weakest one each week. The number we watch first is cost per booked call.\n\nSeat's here if useful: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=nelbin", "subject": ""}, {"track": "main", "step": 3, "days": 5, "when": "", "action": "Message", "chars": "306", "text": "Last nudge, {{firstName}}. It runs every week, so any Thursday works: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=nelbin\n\nAnd if a quick chat about {{company}} would help more than a session, just reply here.", "s stom.post_topic}} showed one piece of the stack. In most companies I see, leads get lost in the gaps between tools: form, CRM, outreach, calendar. The session shows how the pieces connect and where AI agents sit, with every stage measured.\n\nAdi, our founder, hosts it every Thursday at 10:00 UK time (11:00 in Central Europe), and the stack I build is part of what he shows. Your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=bharath", "subject": ""}, {"track": "2nd/3rd degree", "step": 4, "days": 4, "when": "", "action": "Message", "chars": "312", "text": "{{firstName}}, a number for scale: across 11 webinars for a UK coaching group, outreach reached 765,105 people and 80 sales calls were booked.\n\nThe wiring behind that is in the session: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=bharath", "subject": ""}]}, {"name": "1st degree", "rows": [{"track": "1st degree", "step": 1, "days": 0, "when": "", "action": "Message", "chars": "370", "text": "{{firstName}}, saw you on my post about {{custom.post_topic}}.\n\nIf you would rather see the wiring than read about it, Adi, our founder, walks through the stack live every Thursday at 10:00 UK time (11:00 in Central Europe): https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=bharath", "subject": ""}, {"track": "1st degree", "step": 2, "days": 4, "when": "", "action": "Message", "chars": "271", "text": "{{firstName}}, one more pointer: the session shows where {{custom.post_topic}} breaks between tools and how to instrument it. https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=bharath", "subject": ""}]}]}, {"title": "InMail", "full": "InMail (Shared Template, Sales Navigator Only)", "who": "Prospects in this sender's audience who are not connected and are worth an InMail: Open Profiles first (no credit used), then the best fits on credits. Off until this account is on Sales Navigator. If Tantra shows no InMail step, step 1 is sent by hand in Sales Navigator and, 5 days later, **only the people who did not reply** are imported into the follow-up campaign.", "tracks": [{"name": "InMail", "rows": [{"track": "InMail", "step": 1, "days": 0, "when": "", "action": "InMail", "chars": "771", "text": "Hi {{firstName}},\n\nQuick question: could you predict next quarter's booked sales calls at {{company}} today?\n\nMost founders I speak with can't. Leads come from referrals, a good month on ads, a lucky post. Nothing they can measure and repeat, and every cold call then has to earn trust from zero.\n\nAdi, our founder, hosts a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on building the other kind of pipeline: the funnel, the RevOps system behind it and the AI that runs the busywork. It draws on 10+ years of work with 400+ brands.\n\n60 minutes, including 15 minutes of Q&A. Save your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=inmail&utm_campaign=enterprise-webinar&utm_content=bharath\n\nBharath", "subject": "{{firstName}}, a question about pipeline at {{company}}"}]}, {"name": "Follow-up", "rows": [{"track": "Follow-up", "step": 1, "days": 0, "when": "5 days after the InMail, non-repliers only", "action": "Connection request with note (no note on free)", "chars": "138", "text": "Hi {{firstName}}, I sent you an InMail last week about building a pipeline you can measure. Connecting either way, as our work overlaps.", "subject": ""}, {"track": "Follow-up", "step": 2, "days": 1, "when": "1 day after they accept", "action": "Message", "chars": "299", "text": "Thanks for connecting, {{firstName}}. Here's the session link I mentioned: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=inmail&utm_campaign=enterprise-webinar&utm_content=bharath\n\nIt runs every Thursday at 10:00 UK time (11:00 in Central Europe), so pick whichever week suits you.", "subject": ""}]}]}, {"title": "Connector", "full": "Connector (Shared Template)", "who": "Cold prospects in this sender's audience (2nd and 3rd degree). Only people who accept get the messages.", "tracks": [{"name": "main", "rows": [{"track": "main", "step": 1, "days": 0, "when": "", "action": "Visit profile", "chars": "n/a", "text": "", "subject": ""}, {"track": "main", "step": 2, "days": 1, "when": "", "action": "Connection request with note (no note on free)", "chars": "190", "text": "Hi {{firstName}}, could you predict next quarter's booked sales calls at {{company}} from the numbers you have today? That's the problem I work on. Glad to connect.", "subject": ""}, {"track": "main", "step": 3, "days": 1, "when": "1 day after they accept; no link yet", "action": "Message", "chars": "350", "text": "Thanks for connecting, {{firstName}}.\n\nOne pattern I see in almost every founder-led company: the problem isn't traffic. It's that nobody can see where a prospect drops out between first touch and a booked call.\n\nFix that view and the next hire, channel or budget decision gets obvious.\n\nHow does {{company}} track it today?", "subject": ""}, {"track": "main", "step": 4, "days": 3, "when": "", "action": "Message", "chars": "640", "text": "{{firstName}}, this is what we take apart live, every Thursday at 10:00 UK time (11:00 in Central Europe).\n\nA cold sales call has to build trust, frame the problem and close, all in one slot. A session does the first two before anyone books, so the call starts further along.\n\nAdi, our founder, hosts the session: 60 minutes on the funnel, the RevOps system behind it, the AI that does the busywork and the channels that fill it.\n\nBring your numbers. You'll leave knowing which stage to fix first.\n\nSave your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=bharath", "subject": ""}, {"track": "main", "step": 5, "days": 4, "when": "", "action": "Message", "chars": "426", "text": "This isn't theory, {{firstName}}.\n\nFor Growth Idea, a UK business-coaching group, one webinar reached 99,859 people. 1,990 registered, 321 came live and 25 booked sales calls.\n\nTheir first webinar got 30 registrations. Every stage was measured, so every week got better.\n\nThe session shows the build: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=bharath", "subject": ""}, {"track": "main", "step": 6, "days": 6, "when": "", "action": "Message", "chars": "381", "text": "Last note from me, {{firstName}}.\n\nIf a predictable pipeline is on this year's list for {{company}}, the session runs every Thursday at 10:00 UK time (11:00 in Central Europe): https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=bharath\n\nIf not, no hard feelings. Good luck with the quarter.", "subject": ""}]}]}, {"title": "Messenger", "full": "Messenger (Shared Template, 1st-Degree Connections)", "who": "This sender's own 1st-degree connections who match the audience and are owned by no other sender.", "tracks": [{"name": "main", "rows": [{"track": "main", "step": 1, "days": 0, "when": "", "action": "Message", "chars": "604", "text": "{{firstName}}, quick question: how much of {{company}}'s pipeline last quarter came from referrals nobody could have planned for?\n\nFor most founders I speak with, it's most of it.\n\nAdi, our founder, hosts a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on building the other kind: a funnel, a RevOps system and AI on the busywork, measured stage by stage. It draws on 10+ years of work with 400+ brands.\n\n60 minutes. Want a seat? https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=bharath", "subject": ""}, {"track": "main", "step": 2, "days": 4, "when": "", "action": "Message", "chars": "429", "text": "{{firstName}}, one number from the session: a UK coaching group went from 30 registrations on their first webinar to 1,990 on their best.\n\nSame team. The difference was measuring every stage and fixing the weakest one each week. The number we watch first is cost per booked call.\n\nSeat's here if useful: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=bharath", "subject": ""}, {"track": "main", "step": 3, "days": 5, "when": "", "action": "Message", "chars": "307", "text": "Last nudge, {{firstName}}. It runs every week, so any Thursday works: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=messenger&utm_campaign=enterprise-webinar&utm_content=bharath\n\nAnd if a quick chat about {{company}} would help more than a session, just reply here.", "subject": ""}]}]}]}, {"key": "bhaskar", "name": "Bhaskar Dev", "headline": "Co-Founder, GrowthClub.org | Architecting Agentic AI Revenue Engines for SaaS | Ex-Head of Growth @ Cavli Wireless | Advisor @ Budmore & Nxtaa Tech", "role": "CMO", "pronouns": "He/Him", "initials": "BD", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCADAAMADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uP lad to connect.", "subject": ""}, {"track": "2nd/3rd degree", "step": 3, "days": 1, "when": "1 day after they accept", "action": "Message", "chars": "548", "text": "Appreciate the connect, {{firstName}}.\n\nThat post on {{custom.post_topic}} was one piece of the system. Most marketing leaders I talk to can count posts, clicks and registrations but not which ones booked a call. The session shows the whole path from content to booked call, with a number on every stage.\n\nAdi, our founder, hosts it every Thursday at 10:00 UK time (11:00 in Central Europe). Your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=bhaskar", "subject": ""}, {"track": "2nd/3rd degree", "step": 4, "days": 4, "when": "", "action": "Message", "chars": "301", "text": "{{firstName}}, a single episode for a London fintech network went out as 38,138 calendar invites and drew 187 Yes and 221 Maybe RSVPs.\n\nThe setup behind it is in the session: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=bhaskar", "subject": ""}]}, {"name": "1st degree", "rows": [{"track": "1st degree", "step": 1, "days": 0, "when": "", "action": "Message", "chars": "360", "text": "Thanks for weighing in on my {{custom.post_topic}} post, {{firstName}}.\n\nAdi, our founder, runs a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on the full path from content to booked call: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=bhaskar", "subject": ""}, {"track": "1st degree", "step": 2, "days": 4, "when": "", "action": "Message", "chars": "286", "text": "One more thought, {{firstName}}: if {{custom.post_topic}} matters to your pipeline this quarter, Thursday's session ties it to booked calls. https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=engagement&utm_campaign=enterprise-webinar&utm_content=bhaskar", "subject": ""}]}]}, {"title": "InMail", "full": "InMail (Shared Template, Sales Navigator Only)", "who": "Prospects in this sender's audience who are not connected and are worth an InMail: Open Profiles first (no credit used), then the best fits on credits. Off until this account is on Sales Navigator. If Tantra shows no InMail step, step 1 is sent by hand in Sales Navigator and, 5 days later, **only the people who did not reply** are imported into the follow-up campaign.", "tracks": [{"name": "InMail", "rows": [{"track": "InMail", "step": 1, "days": 0, "when": "", "action": "InMail", "chars": "771", "text": "Hi {{firstName}},\n\nQuick question: could you predict next quarter's booked sales calls at {{company}} today?\n\nMost founders I speak with can't. Leads come from referrals, a good month on ads, a lucky post. Nothing they can measure and repeat, and every cold call then has to earn trust from zero.\n\nAdi, our founder, hosts a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on building the other kind of pipeline: the funnel, the RevOps system behind it and the AI that runs the busywork. It draws on 10+ years of work with 400+ brands.\n\n60 minutes, including 15 minutes of Q&A. Save your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=inmail&utm_campaign=enterprise-webinar&utm_content=bhaskar\n\nBhaskar", "subject": "{{firstName}}, a question about pipeline at {{company}}"}]}, {"name": "Follow-up", "rows": [{"track": "Follow-up", "step": 1, "days": 0, "when": "5 days after the InMail, non-repliers only", "action": "Connection request with note (no note on free)", "chars": "138", "text": "Hi {{firstName}}, I sent you an InMail last week about building a pipeline you can measure. Connecting either way, as our work overlaps.", "subject": ""}, {"track": "Follow-up", "step": 2, "days": 1, "when": "1 day after they accept", "action": "Message", "chars": "299", "text": "Thanks for connecting, {{firstName}}. Here's the session link I mentioned: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=inmail&utm_campaign=enterprise-webinar&utm_content=bhaskar\n\nIt runs every Thursday at 10:00 UK time (11:00 in Central Europe), so pick whichever week suits you.", "subject": ""}]}]}, {"title": "Connector", "full": "Connector (Shared Template)", "who": "Cold prospects in this sender's audience (2nd and 3rd degree). Only people who accept get the messages.", "tracks": [{"name": "main", "rows": [{"track": "main", "step": 1, "days": 0, "when": "", "action": "Visit profile", "chars": "n/a", "text": "", "subject": ""}, {"track": "main", "step": 2, "days": 1, "when": "", "action": "Connection request with note (no note on free)", "chars": "190", "text": "Hi {{firstName}}, could you predict next quarter's booked sales calls at {{company}} from the numbers you have today? That's the problem I work on. Glad to connect.", "subject": ""}, {"track": "main", "step": 3, "days": 1, "when": "1 day after they accept; no link yet", "action": "Message", "chars": "350", "text": "Thanks for connecting, {{firstName}}.\n\nOne pattern I see in almost every founder-led company: the problem isn't traffic. It's that nobody can see where a prospect drops out between first touch and a booked call.\n\nFix that view and the next hire, channel or budget decision gets obvious.\n\nHow does {{company}} track it today?", "subject": ""}, {"track": "main", "step": 4, "days": 3, "when": "", "action": "Message", "chars": "640", "text": "{{firstName}}, this is what we take apart live, every Thursday at 10:00 UK time (11:00 in Central Europe).\n\nA cold sales call has to build trust, frame the problem and close, all in one slot. A session does the first two before anyone books, so the call starts further along.\n\nAdi, our founder, hosts the session: 60 minutes on the funnel, the RevOps system behind it, the AI that does the busywork and the channels that fill it.\n\nBring your numbers. You'll leave knowing which stage to fix first.\n\nSave your seat: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=bhaskar", "subject": ""}, {"track": "main", "step": 5, "days": 4, "when": "", "action": "Message", "chars": "426", "text": "This isn't theory, {{firstName}}.\n\nFor Growth Idea, a UK business-coaching group, one webinar reached 99,859 people. 1,990 registered, 321 came live and 25 booked sales calls.\n\nTheir first webinar got 30 registrations. Every stage was measured, so every week got better.\n\nThe session shows the build: https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=bhaskar", "subject": ""}, {"track": "main", "step": 6, "days": 6, "when": "", "action": "Message", "chars": "381", "text": "Last note from me, {{firstName}}.\n\nIf a predictable pipeline is on this year's list for {{company}}, the session runs every Thursday at 10:00 UK time (11:00 in Central Europe): https://webinar.usetantra.com/?utm_source=linkedin&utm_medium=connector&utm_campaign=enterprise-webinar&utm_content=bhaskar\n\nIf not, no hard feelings. Good luck with the quarter.", "subject": ""}]}]}, {"title": "Messenger", "full": "Messenger (Shared Template, 1st-Degree Connections)", "who": "This sender's own 1st-degree connections who match the audience and are owned by no other sender.", "tracks": [{"name": "main", "rows": [{"track": "main", "step": 1, "days": 0, "when": "", "action": "Message", "chars": "604", "text": "{{firstName}}, quick question: how much of {{company}}'s pipeline last quarter came from referrals nobody could have planned for?\n\nFor most founders I speak with, it's most of it.\n\nAdi, our founder, hosts a live session every Thursday at 10:00 UK time (11:00 in Central Europe) on building the other kind: a funnel, a RevOps system and AI on the busywork, measured stage by stage. It draws on 10+ years of work with 400+ brands.\n\n60 minutes. Want a seat? ht   };

  /* ---------- text ---------- */
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const TOK = /\{\{([\w.]+)\}\}/g;
  const URL_RE = /(https?:\/\/[^\s]+|(?:\{\{domains\.funnel_domain\}\}|\b[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|ai|io|co|org|net|uk))\/[^\s]*)/gi;
  const valueOf = (k) => SAMPLE[k] ?? CONFIG_TOKENS[k];
  function fill(text, mode) { return String(text).replace(TOK, (m, k) => (mode === "sample" && valueOf(k) !== undefined ? valueOf(k) : m)); }
  function marked(text) {
    // Sample mode: per-recipient merge values are wrapped in \u0001..\u0002 so they can be tinted.
    return String(text).replace(TOK, (m, k) => {
      if (state.mode !== "sample") return m;
      if (k in SAMPLE) return "\u0001" + SAMPLE[k] + "\u0002";
      return CONFIG_TOKENS[k] ?? m;
    });
  }
  function inline(s) {
    return esc(s).replace(/\u0001/g, '<span class="mf">').replace(/\u0002/g, "</span>").replace(TOK, '<span class="tok">{{$1}}</span>');
  }
  function rich(text) {
    const src = marked(text);
    let out = "", last = 0;
    src.replace(URL_RE, (m, _g, idx) => {
      let url = m, trail = "";
      const t = url.match(/[.,;:!?)]+$/);
      if (t) { trail = t[0]; url = url.slice(0, -trail.length); }
      out += inline(src.slice(last, idx));
      const clean = fill(url.replace(/[\u0001\u0002]/g, ""), "sample");
      const href = /^https?:/i.test(clean) ? clean : "https://" + clean;
      out += `<a class="lnk" href="${esc(href)}" target="_blank" rel="noopener">${inline(url)}</a>${inline(trail)}`;
      last = idx + m.length;
      return m;
    });
    return out + inline(src.slice(last));
  }
  const plain = (text) => fill(text, state.mode);
  const words = (t) => t.trim().split(/\s+/).filter(Boolean).length;
  const firstUrl = (t) => { const m = fill(t, "sample").match(URL_RE); return m ? m[0].replace(/[.,;:!?)]+$/, "") : ""; };

  const copyBtn = (text, label, cls) => `<button class="copy ${cls || ""}" data-copy="${reg(text, label)}">${esc(label)}</button>`;

  function card(n, label, sub, screen, foot) {
    return `<article class="card"><header class="card-head">${n ? `<span class="step-num">${esc(n)}</span>` : ""}<div><div class="card-label">${label}</div>${sub ? `<div class="card-sub">${sub}</div>` : ""}</div></header>${screen}<footer class="card-foot">${foot || ""}</footer></article>`;
  }

  /* ---------- LinkedIn ---------- */
  function liPreview(text) {

  function renderLinkedIn() {
    const sender = D.senders[state.sender];
    const chips = D.senders.map((s, i) => `<button class="sender ${i === state.sender ? "on" : ""}" data-sender="${i}">${av(s, 26)}${esc(s.name.split(" ")[0])}</button>`).join("");
    const sets = sender.sets.map((set, si) => {
      const tracks = set.tracks.map(tr => {

          const firstDegree = /1st degree|Messenger/i.test(tr.name + set.title);
          r.firstDegree = firstDegree;
          let screen, meta, kind = r.action;
          if (/Visit profile/.test(r.action)) { screen = liVisit(sender); meta = "No text: the visit shows up in their notifications"; }
          else if (/Connection request/.test(r.action)) { screen = liInvite(sender, r); const n = fill(r.text, "sample").length; meta = `${n}/300 chars · note goes out on Sales Navigator only; free accounts send no note`; }
          else if (/InMail/.test(r.action)) { screen = liInMail(sender, r); const t = fill(r.text, "sample"); meta = `${words(t)} words · ${t.length} chars`; }
          else { screen = liThread(sender, r, day); const t = fill(r.text, "sample"); meta = `${words(t)} words · ${t.length} chars`; }

  /* ---------- Calendar ---------- */
