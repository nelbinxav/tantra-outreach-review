    const grid = `<div class="gc-grid"><div>${hours}</div>${cols.map(c => `<div class="gc-col">${c}</div>`).join("")}</div>`;
    const wk = S.week.slice(2, 5);
    const head = `<div class="gc-week"><div></div>${wk.map(d => `<div class="d ${d.on ? "on" : ""}">${["Wed", "Thu", "Fri"][wk.indexOf(d)]}<b>${d.day}</b></div>`).join("")}</div>`;
    return statusBar() + `<div class="gc-top"><span class="ic">${I.menu}</span><span class="m">${esc(S.month)}</span><span class="ic">${I.search}</span><span class="ic"><span class="gc-today">${S.day}</span></span>${av(P, 30)}</div>${head}<div class="body" style="padding-top:8px">${grid}</div><div class="gc-fab">${I.plus}</div>` + home;
  }
  function gcDetail(inv) {
    return statusBar() + `<div class="gc-detail-top"><span class="ic">${I.x}</span><span class="sp"></span><span class="ic">${I.mail}</span><span class="ic">${I.vmore}</span></div><div class="body">
      <div class="gc-title"><span class="sq"></span><div><div class="t selectable">${rich(inv.title)}</div><div class="w">${S.dow_long}, ${S.day} ${S.month}<br>${evTime}</div></div></div>
      <div class="gc-line"><span class="i">${I.pin}</span><div class="v selectable">${rich(inv.location)}</div></div>
      <div class="gc-line"><span class="i">${I.person}</span><div class="v">${esc(inv.sender.name)}<small>Organiser · ${esc(inv.sender.email)}</small></div></div>
      <div class="gc-line"><span class="i">${I.bell}</span><div class="v">30 minutes before</div></div>
      <div class="gc-line"><span class="i">${I.cal}</span><div class="v">${esc(P.first)}<small>Invitation not yet answered</small></div></div>
      <div class="gc-line"><span class="i">${I.lines}</span><div class="v gc-desc selectable">${rich(inv.desc)}</div></div><div style="height:14px"></div></div>
      <div class="gc-going"><span class="g">Going?</span><span class="b">Yes</span><span class="b">No</span><span class="b">Maybe</span></div>` + home;
  }
  function renderCalendar() {
    const chipOf = (c) => c === "Re-invite" || c === "Last invite" ? "re" : "test";
    const invites = D.calendar.map(inv => {
      const t = plain(inv.title), d = fill(inv.desc, "sample"), sampleTitle = fill(inv.title, "sample");
      const copies = (extra) => `<div class="copies">${copyBtn(inv.title, "Copy title", "alt")}${copyBtn(inv.desc, "Copy description")}${copyBtn(inv.location, "Copy location", "alt")}${editBtn(inv, "title", "Edit title")}${editBtn(inv, "desc", "Edit description")}${extra || ""}</div>`;
      const c1 = card("1", "Invitation email in Gmail", "What lands in the inbox: Google sends it from the sender's own calendar", phone(gcInvitationEmail(inv)), `<div class="foot-row">${copies()}</div>`);
      const c2 = card("2", "On their calendar", `3-day view. Grid cut, first 24 characters: “${esc(sampleTitle.slice(0, 24))}”`, phone(gcDayView(inv)), `<div class="foot-row"><span>${sampleTitle.length} chars in the title</span>${copyBtn(inv.title, "Copy title", "alt")}</div>`);
      const c3 = card("3", "Event opened", "Google Calendar iOS: location link, then the full description", phone(gcDetail(inv)), `<div class="foot-row"><span>${words(d)} words · ${d.length} chars</span>${copies()}</div>`);
      return `<section class="campaign" id="cal-${esc(inv.id)}"><div class="campaign-head"><div class="campaign-title"><h3>${/^R/.test(inv.id) ? "" : "Variant "}${esc(inv.id)}: ${esc(inv.name)}</h3><span class="chip ${chipOf(inv.cycle)}">${esc(inv.cycle)}</span>${inv.tags !== "none" ? `<span class="chip tag">${esc(inv.tags)}</span>` : '<span class="chip">No merge tags</span>'}<span class="chip">${esc(inv.utm)}</span></div><p><b>Send to:</b> ${esc(inv.send_to)}.</p></div><div class="rail">${c1}${c2}${c3}</div></section>`;
    }).join("");
    return `<section class="channel gc-band" id="ch-cal"><div class="channel-head"><span class="app-ic gc">${I.gcal}</span><div><h2>Cold calendar invites</h2><p>${esc(S.date_words)}, ${esc(S.range_words)}. Each invite in three places: the invitation email Google sends, the event on their calendar, and the event opened with its full description. Text inside the phones is selectable; the buttons copy the exact field to paste into Tantra.</p></div></div>${invites}</section>`;
  }

  /* ---------- links ---------- */
  function renderLinks() {
    const urls = [];
    const add = (u, where) => { const f = fill(u, "sample"); const ex = urls.find(x => x.u === f); ex ? ex.where.add(where) : urls.push({ u: f, where: new Set([where]) }); };
    D.calendar.forEach(c => add(c.location, "Calendar " + c.id));
    D.emails.forEach(e => e.steps.forEach(s => { const u = firstUrl(s.text); if (u) add(u, "Email " + e.id); }));
    D.senders[state.sender].sets.forEach(set => set.tracks.forEach(t => t.rows.forEach(r => { const u = firstUrl(r.text || ""); if (u) add(u, "LinkedIn: " + set.title); })));
    return `<section class="campaign" id="links"><div class="campaign-head"><h3>Link check</h3><p>Every registration link used above, with its UTM tag. Checked ${esc(D.built)}: ${esc(D.funnel_domain)} did not resolve yet (the pages are not deployed), so no link opens today. Rebuild after the deploy and click one per channel.</p></div><div class="panel"><table><thead><tr><th>URL</th><th>Used in</th><th>Status</th></tr></thead><tbody>${urls.map(x => `<tr><td><a class="lnk" href="${esc(/^https?:/.test(x.u) ? x.u : "https://" + x.u)}" target="_blank" rel="noopener">${esc(x.u)}</a></td><td>${esc([...x.where].join(", "))}</td><td><span class="st warn">not live yet</span></td></tr>`).join("")}</tbody></table></div></section>`;
  }

  /* ---------- page ---------- */
  function render() {
    REG = {}; seq = 0;
    const main = document.getElementById("main");
    const keep = window.scrollY;
    main.innerHTML = `<div class="intro"><div class="eyebrow">Tantra Enterprise webinar · outreach</div><h1>Every Touch, as the Prospect Sees It</h1><p>Built from the real template files (cards 4, 11 and 12), so this page cannot drift from the copy that gets loaded. Session: <b>${esc(D.webinar.title)}</b>, ${esc(S.date_words)}, ${esc(S.range_words)}, then weekly. Preview only: nothing here is sent or loaded. The sample prospect, Sarah Mitchell at Northgate Advisory, is made up.</p><div class="legend"><span><span class="mf">Sarah</span> merge value (sample)</span><span><span class="tok">{{firstName}}</span> raw merge tag</span><span>Copy buttons copy what you see: sample values or raw tags (top right)</span></div></div>`
      + renderCalendar() + renderEmail() + renderLinkedIn() + renderLinks()
      + `<footer class="page">Rebuild after any copy change: <code>python3 deliverables/_outreach-preview/build.py</code>. Built ${esc(D.built)}.</footer>`;
    const nav = [];
    nav.push(`<h4><span class="dot" style="background:var(--gc-blue)"></span>Calendar</h4>` + D.calendar.map(c => `<a data-target="cal-${esc(c.id)}">${esc(c.id)} · ${esc(fill(c.title, "sample").slice(0, 26))}<span class="n">${esc(c.cycle === "First invite" ? "" : c.cycle)}</span></a>`).join(""));
    nav.push(`<h4><span class="dot" style="background:var(--gm-red)"></span>Cold email</h4>` + D.emails.map(e => `<a data-target="em-${e.id}">Template ${e.id} · ${esc(e.name)}</a>`).join("") + `<a data-target="em-maybe">Maybe-RSVP email</a><a data-target="em-replies">Reply handling</a>`);
    nav.push(`<h4><span class="dot" style="background:var(--li)"></span>LinkedIn · ${esc(D.senders[state.sender].name.split(" ")[0])}</h4>` + D.senders[state.sender].sets.map((s, i) => `<a data-target="li-${i}">${esc(s.title)}</a>`).join(""));
    nav.push(`<h4>More</h4><a data-target="links">Link check</a>`);
    document.getElementById("sidenav").innerHTML = nav.join("");
    decorateReview();
    window.scrollTo(0, keep);
  }


  /* ---------- Review: section comments and template edits (review-worker/) ---------- */
  const API = "";
  const RV = { on: /^https?:\/\//.test(API), comments: [], edits: [], keys: {}, orig: {}, open: {}, me: "", err: "" };
  try { RV.me = localStorage.getItem("rv-name") || ""; } catch (e) {}
  function regKey(obj, prop, key) {
    RV.keys[key] = { obj, prop };
    if (!(key in RV.orig)) RV.orig[key] = obj[prop];
    if (!Object.prototype.hasOwnProperty.call(obj, "__k")) Object.defineProperty(obj, "__k", { value: {}, enumerable: true, writable: true });
    obj.__k[prop] = key;
  }
  D.calendar.forEach(inv => { regKey(inv, "title", `cal/${inv.id}/title`); regKey(inv, "desc", `cal/${inv.id}/description`); });
  D.emails.forEach(e => {
    e.subjects.forEach((_, i) => regKey(e.subjects, i, `email/${e.id}/subject${i + 1}`));
    e.steps.forEach((st, i) => regKey(st, "text", `email/${e.id}/step${i + 1}`));
  });
  regKey(D.maybe, "subject", "email/maybe/subject"); regKey(D.maybe, "text", "email/maybe/body");
  D.senders.forEach(sn => sn.sets.forEach((set, si) => set.tracks.forEach(tr => tr.rows.forEach(r => {
    if (!r.text) return;
    const b = `linkedin/${sn.key}/set${si + 1}/${tr.name}/step${r.step}`;
    regKey(r, "text", b);
    if (r.subject) regKey(r, "subject", b + "/subject");
  }))));
  const editsFor = (k) => RV.edits.filter(x => x.key === k);
  function applyEdits() {
    for (const k in RV.keys) {
      const hist = editsFor(k), { obj, prop } = RV.keys[k];
      obj[prop] = hist.length ? hist[hist.length - 1].text : RV.orig[k];
    }
  }
  const editBtn = (obj, prop, label) => {
    const k = obj && obj.__k && obj.__k[prop];
    if (!k || !RV.on) return "";
    const h = editsFor(k), n = h.length;
    return `<button class="copy rv-edit${n ? " edited" : ""}" data-edit="${esc(k)}" title="${n ? "Edited " + n + "x, last by " + esc(h[n - 1].author) : "Edit this text"}">✎ ${esc(label)}${n ? " · edited" : ""}</button>`;
  };
  async function rvLoad() {
    if (!RV.on) return;
    try {
      const r = await fetch(API + "/api/state", { cache: "no-store" });
      const j = await r.json(); RV.comments = j.comments || []; RV.edits = j.edits || []; RV.err = "";
    } catch (e) { RV.err = "Comments and edits could not load. Check your connection, then reload."; }
    applyEdits();
  }
  async function rvPost(path, body) {
    const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    return r.json();
  }
  function sectionKey(id) { return /^li-\d+$/.test(id) ? `li-${D.senders[state.sender].key}-${id.slice(3)}` : id; }
  const when = (iso) => { try { return new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } };
  function decorateReview() {
    if (!RV.on) return;
    document.querySelectorAll("section.campaign").forEach(sec => {
      const key = sectionKey(sec.id), head = sec.querySelector(".campaign-head"); if (!head) return;
      const list = RV.comments.filter(c => c.section === key), open = list.filter(c => !c.resolved).length;
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "rv-cbtn" + (open ? " has" : ""); btn.dataset.rvToggle = key;
      btn.textContent = `💬 Comments${list.length ? ` (${open} open${list.length > open ? `, ${list.length - open} resolved` : ""})` : ""}`;
      (head.querySelector(".campaign-title") || head).appendChild(btn);
      if (!RV.open[key]) return;
      const items = list.map(c => `<div class="rv-c${c.resolved ? " done" : ""}"><div class="rv-ch"><b>${esc(c.author)}</b><span>${esc(when(c.created_at))}</span><button type="button" data-rv-res="${c.id}" data-to="${c.resolved ? "reopen" : "resolve"}">${c.resolved ? "Reopen" : "Resolve"}</button></div><div class="rv-cb">${esc(c.body)}</div></div>`).join("");
      const panel = document.createElement("div"); panel.className = "rv-panel";
      panel.innerHTML = `${items || '<div class="rv-empty">No comments yet on this section.</div>'}<form class="rv-form" data-rv-form="${esc(key)}"><input name="author" placeholder="Your name" maxlength="60" value="${esc(RV.me)}" required><textarea name="body" placeholder="Comment on this section: what should change, and why?" maxlength="4000" required></textarea><button type="submit">Post comment</button></form>`;
      head.appendChild(panel);
    });
    if (RV.err) toast(RV.err);
  }
  function rvModal(k) {
    const { obj, prop } = RV.keys[k] || {}; if (!obj) return;
    const hist = editsFor(k).slice().reverse();
    const m = document.getElementById("rv-modal");
    m.innerHTML = `<div class="rv-box" role="dialog" aria-label="Edit text"><div class="rv-mh"><b>Edit text</b><code>${esc(k)}</code><button type="button" class="rv-x" data-rv-close aria-label="Close">✕</button></div>
      <p class="rv-hint">Keep merge tags exactly as written, for example <code>{{firstName}}</code>. Saving updates this page for everyone. The live templates change only after the team copies approved edits back.</p>
      <textarea id="rv-text" spellcheck="true">${esc(obj[prop])}</textarea>
      <div class="rv-row"><input id="rv-name" placeholder="Your name" maxlength="60" value="${esc(RV.me)}"><span class="rv-count" id="rv-count"></span><button type="button" class="rv-save" data-rv-save="${esc(k)}">Save edit</button></div>
      <details ${hist.length ? "open" : ""}><summary>History (${hist.length} edit${hist.length === 1 ? "" : "s"})</summary>
      ${hist.map(h => `<div class="rv-h"><div><b>${esc(h.author)}</b> · ${esc(when(h.created_at))}<button type="button" data-rv-restore="${h.id}">Restore this</button></div><pre>${esc(h.text)}</pre></div>`).join("")}
      <div class="rv-h"><div><b>Original</b> (from the template files)<button type="button" data-rv-restore="orig">Restore original</button></div><pre>${esc(RV.orig[k])}</pre></div></details></div>`;
    m.classList.add("show"); m.dataset.key = k;
    const ta = document.getElementById("rv-text"), cnt = () => { document.getElementById("rv-count").textContent = ta.value.length + " chars"; };
    ta.addEventListener("input", cnt); cnt(); ta.focus();
  }
  document.addEventListener("click", async (e) => {
    const ed = e.target.closest("[data-edit]"); if (ed) { rvModal(ed.dataset.edit); return; }
    const tg = e.target.closest("[data-rv-toggle]"); if (tg) { const k = tg.dataset.rvToggle; RV.open[k] = !RV.open[k]; render(); return; }
    const m = document.getElementById("rv-modal");
    if (e.target.closest("[data-rv-close]") || e.target === m) { m.classList.remove("show"); return; }
    const rs = e.target.closest("[data-rv-restore]");
    if (rs) {
      const k = m.dataset.key, id = rs.dataset.rvRestore, ta = document.getElementById("rv-text");
      ta.value = id === "orig" ? RV.orig[k] : (RV.edits.find(x => String(x.id) === id) || {}).text || "";
      ta.dispatchEvent(new Event("input")); return;
    }
    const sv = e.target.closest("[data-rv-save]");
    if (sv) {
      const k = sv.dataset.rvSave, text = document.getElementById("rv-text").value, author = document.getElementById("rv-name").value.trim();
      if (!author) { toast("Add your name first"); document.getElementById("rv-name").focus(); return; }
      if (text === RV.keys[k].obj[RV.keys[k].prop]) { m.classList.remove("show"); return; }
      sv.disabled = true;
      try {
        RV.me = author; try { localStorage.setItem("rv-name", author); } catch (er) {}
        await rvPost("/api/edits", { key: k, text, author }); await rvLoad(); m.classList.remove("show"); render(); toast("Edit saved for everyone");
      } catch (er) { toast("Could not save: " + er.message); sv.disabled = false; }
      return;
    }
    const rb = e.target.closest("[data-rv-res]");
    if (rb) { try { await rvPost(`/api/comments/${rb.dataset.rvRes}/${rb.dataset.to}`); await rvLoad(); render(); } catch (er) { toast("Could not update: " + er.message); } return; }
  });
  document.addEventListener("submit", async (e) => {
    const f = e.target.closest("[data-rv-form]"); if (!f) return;
    e.preventDefault();
    const author = f.author.value.trim(), body = f.body.value.trim(); if (!author || !body) return;
    const b = f.querySelector("button"); b.disabled = true;
    try {
      RV.me = author; try { localStorage.setItem("rv-name", author); } catch (er) {}
      await rvPost("/api/comments", { section: f.dataset.rvForm, author, body }); await rvLoad(); render(); toast("Comment posted");
    } catch (er) { toast("Could not post: " + er.message); b.disabled = false; }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("rv-modal").classList.remove("show"); });

  document.addEventListener("click", (e) => {
    const nav = e.target.closest("[data-target]");
    if (nav) {
      e.preventDefault();
      const el = document.getElementById(nav.dataset.target);
      if (el) {
        const top = el.getBoundingClientRect().top + window.scrollY - (document.querySelector(".topbar").offsetHeight + 8);
        window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
        document.querySelectorAll(".sidenav a").forEach(a => a.classList.toggle("active", a === nav));
      }
      return;
    }
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      const r = REG[cp.dataset.copy]; if (!r) return;
      const text = plain(r.text);
      const done = () => toast(`${r.label.replace("Copy ", "").replace(/^Copy$/, "Text")} copied ${state.mode === "sample" ? "with sample data" : "with raw {{tags}}"}`);
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
      else fallbackCopy(text, done);
      return;
    }
    const sb = e.target.closest("[data-sender]");
    if (sb) { state.sender = +sb.dataset.sender; render(); return; }
    const seg = e.target.closest(".seg button");
    if (seg) {
      seg.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === seg));
      if (seg.dataset.mode) { state.mode = seg.dataset.mode; render(); }
      if (seg.dataset.scale) { state.scale = +seg.dataset.scale; applyScale(); }
    }
  });
  function fallbackCopy(text, done) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (err) { toast("Copy failed: select the text instead"); } ta.remove();
  }
  document.getElementById("tgl-preview").addEventListener("change", (e) => document.body.classList.toggle("no-preview", !e.target.checked));
  document.getElementById("tgl-mark").addEventListener("change", (e) => document.body.classList.toggle("no-mark", !e.target.checked));
  let tt; function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1700); }
  function applyScale() {
    const fit = window.innerWidth < 900 ? Math.min(state.scale, (window.innerWidth - 40) / 417) : state.scale;
    document.documentElement.style.setProperty("--s", fit.toFixed(3));
  }
  window.addEventListener("resize", applyScale);
  applyScale();
  render();
  if (RV.on) rvLoad().then(render);
})();
</script>
</body>
</html>
